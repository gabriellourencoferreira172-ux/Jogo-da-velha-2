<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha</title>
<style>
  :root {
    --text: #e2e8f0;
    --muted: #94a3b8;
    --x: #38bdf8;
    --o: #fb7185;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1000px 600px at 50% -10%, #1e3a5f 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 100%, #2b1e3f 0%, transparent 60%),
      #0b1120;
  }

  .app {
    width: min(100%, 430px);
    padding: 28px 24px 24px;
    border-radius: 28px;
    background: rgba(30, 41, 59, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.15);
    box-shadow: 0 30px 60px -20px rgba(0, 0, 0, .8),
                inset 0 1px 0 rgba(255, 255, 255, .05);
    backdrop-filter: blur(16px);
  }

  h1 { font-size: 1.6rem; text-align: center; letter-spacing: -.02em; }
  .subtitle { text-align: center; color: var(--muted); font-size: .85rem; margin-top: 4px; }

  /* ---------- Seletor de modo ---------- */
  .modes {
    display: flex;
    gap: 6px;
    padding: 5px;
    margin: 20px 0 16px;
    border-radius: 14px;
    background: rgba(15, 23, 42, .7);
  }
  .mode-btn {
    flex: 1;
    padding: 9px 8px;
    border: 0;
    border-radius: 10px;
    background: transparent;
    color: var(--muted);
    font: inherit;
    font-size: .85rem;
    font-weight: 600;
    cursor: pointer;
    transition: .2s;
  }
  .mode-btn:hover { color: var(--text); }
  .mode-btn.active {
    background: rgba(56, 189, 248, .15);
    color: #7dd3fc;
    box-shadow: inset 0 0 0 1px rgba(56, 189, 248, .3);
  }

  /* ---------- Placar ---------- */
  .scoreboard {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .score {
    padding: 10px 6px;
    text-align: center;
    border-radius: 14px;
    background: rgba(15, 23, 42, .6);
    border: 1px solid rgba(148, 163, 184, .1);
  }
  .score-label {
    display: block;
    font-size: .68rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .score-value { display: block; font-size: 1.4rem; font-weight: 700; margin-top: 2px; }
  .score-x .score-value { color: var(--x); }
  .score-o .score-value { color: var(--o); }

  /* ---------- Status ---------- */
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin-bottom: 16px;
    border-radius: 12px;
    background: rgba(15, 23, 42, .5);
    font-size: .95rem;
    font-weight: 600;
    text-align: center;
    transition: color .25s;
  }
  .status.turn-x { color: #7dd3fc; }
  .status.turn-o { color: #fda4af; }
  .status.turn-draw { color: #fcd34d; }

  /* ---------- Tabuleiro ---------- */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    aspect-ratio: 1 / 1;
    margin-bottom: 18px;
  }

  .cell {
    display: grid;
    place-items: center;
    font-family: inherit;
    font-size: clamp(2.2rem, 11vw, 3rem);
    font-weight: 700;
    line-height: 1;
    background: rgba(15, 23, 42, .75);
    border: 1px solid rgba(148, 163, 184, .12);
    border-radius: 18px;
    cursor: pointer;
    transition: background .2s, border-color .2s, transform .1s, box-shadow .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .cell:hover:not(.x):not(.o) {
    background: rgba(56, 189, 248, .08);
    border-color: rgba(56, 189, 248, .25);
  }
  .cell:active:not(.x):not(.o) { transform: scale(.97); }
  .cell:focus-visible { outline: 2px solid var(--x); outline-offset: 2px; }

  .cell.x { color: var(--x); text-shadow: 0 0 24px rgba(56, 189, 248, .5); }
  .cell.o { color: var(--o); text-shadow: 0 0 24px rgba(251, 113, 133, .5); }

  .cell.pop { animation: pop .25s cubic-bezier(.2, 1.4, .5, 1); }
  @keyframes pop {
    from { transform: scale(.4); opacity: .2; }
    to   { transform: scale(1);  opacity: 1; }
  }

  .cell.win {
    background: rgba(250, 204, 21, .12);
    border-color: rgba(250, 204, 21, .5);
    animation: winPulse .8s ease-in-out infinite alternate;
  }
  @keyframes winPulse {
    to { box-shadow: 0 0 0 1px rgba(250, 204, 21, .5), 0 0 34px rgba(250, 204, 21, .35); }
  }

  /* ---------- Botão ---------- */
  .reset {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 16px;
    font: inherit;
    font-size: .95rem;
    font-weight: 700;
    color: #0b1120;
    background: linear-gradient(135deg, #7dd3fc, #38bdf8);
    box-shadow: 0 10px 25px -10px rgba(56, 189, 248, .8);
    cursor: pointer;
    transition: transform .12s, filter .2s;
  }
  .reset:hover { filter: brightness(1.08); }
  .reset:active { transform: scale(.98); }
</style>
</head>
<body>

<div class="app">
  <header>
    <h1>Jogo da Velha</h1>
    <p class="subtitle">Três em linha para vencer</p>
  </header>

  <div class="modes" role="group" aria-label="Modo de jogo">
    <button class="mode-btn active" data-mode="cpu" type="button">vs CPU</button>
    <button class="mode-btn" data-mode="pvp" type="button">2 Jogadores</button>
  </div>

  <div class="scoreboard">
    <div class="score score-x">
      <span class="score-label" id="labelX">Você (X)</span>
      <span class="score-value" id="scoreX">0</span>
    </div>
    <div class="score score-d">
      <span class="score-label">Empates</span>
      <span class="score-value" id="scoreD">0</span>
    </div>
    <div class="score score-o">
      <span class="score-label" id="labelO">CPU (O)</span>
      <span class="score-value" id="scoreO">0</span>
    </div>
  </div>

  <div class="status" id="status">Sua vez</div>

  <div class="board" id="board" role="grid" aria-label="Tabuleiro"></div>

  <button class="reset" id="reset" type="button">Nova Partida</button>
</div>

<script>
/* =========================================================
   CONFIGURAÇÃO
   ========================================================= */
const COMBOS = [
  [0, 1, 2], [3, 4, 5], [6, 7, 8],   // linhas
  [0, 3, 6], [1, 4, 7], [2, 5, 8],   // colunas
  [0, 4, 8], [2, 4, 6]               // diagonais
];

const HUMANO = 'X';
const CPU = 'O';

/* =========================================================
   ESTADO
   ========================================================= */
let board = Array(9).fill('');
let current = HUMANO;
let running = true;
let vsComputer = true;
let scores = { X: 0, O: 0, D: 0 };
let cells = [];
let cpuTimer = null;

/* =========================================================
   ELEMENTOS
   ========================================================= */
const boardEl  = document.getElementById('board');
const statusEl = document.getElementById('status');
const scoreXEl = document.getElementById('scoreX');
const scoreOEl = document.getElementById('scoreO');
const scoreDEl = document.getElementById('scoreD');
const labelXEl = document.getElementById('labelX');
const labelOEl = document.getElementById('labelO');
const resetBtn = document.getElementById('reset');

/* =========================================================
   CONSTRUÇÃO DO TABULEIRO
   ========================================================= */
function buildBoard() {
  boardEl.innerHTML = '';
  cells = [];
  for (let i = 0; i < 9; i++) {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'cell';
    btn.setAttribute('aria-label', `Casa ${i + 1}`);
    btn.addEventListener('click', () => onCellClick(i));
    boardEl.appendChild(btn);
    cells.push(btn);
  }
}

/* =========================================================
   FLUXO DO JOGO
   ========================================================= */
function newGame() {
  clearTimeout(cpuTimer);
  board = Array(9).fill('');
  current = HUMANO;
  running = true;

  cells.forEach(cell => {
    cell.textContent = '';
    cell.className = 'cell';
  });

  updateStatus();
}

function onCellClick(i) {
  if (!running || board[i]) return;
  if (vsComputer && current === CPU) return; // bloqueia durante a vez da CPU
  makeMove(i, current);
}

function makeMove(i, player) {
  board[i] = player;

  const cell = cells[i];
  cell.textContent = player;
  cell.classList.add(player.toLowerCase(), 'pop');

  const result = checkResult(board);
  if (result) {
    endGame(result);
    return;
  }

  current = player === HUMANO ? CPU : HUMANO;
  updateStatus();

  if (vsComputer && current === CPU) {
    cpuTimer = setTimeout(cpuTurn, 450);
  }
}

function cpuTurn() {
  if (!running || current !== CPU) return;
  const move = bestMove();
  if (move !== -1) makeMove(move, CPU);
}

function endGame(result) {
  running = false;

  if (result.draw) {
    scores.D++;
    statusEl.textContent = 'Empate! 🤝';
    statusEl.className = 'status turn-draw';
  } else {
    scores[result.winner]++;
    result.line.forEach(i => cells[i].classList.add('win'));

    if (vsComputer) {
      statusEl.textContent = result.winner === HUMANO ? 'Você venceu! 🎉' : 'CPU venceu! 🤖';
    } else {
      statusEl.textContent = `Jogador ${result.winner} venceu! 🎉`;
    }
    statusEl.className = 'status ' + (result.winner === HUMANO ? 'turn-x' : 'turn-o');
  }

  updateScores();
}

/* =========================================================
   REGRAS
   ========================================================= */
function checkResult(b) {
  for (const combo of COMBOS) {
    const [a, c, d] = combo;
    if (b[a] && b[a] === b[c] && b[a] === b[d]) {
      return { winner: b[a], line: combo };
    }
  }
  if (b.every(v => v !== '')) return { draw: true };
  return null;
}

/* =========================================================
   IA — MINIMAX (imbatível)
   ========================================================= */
function bestMove() {
  let bestScore = -Infinity;
  let move = -1;

  for (let i = 0; i < 9; i++) {
    if (board[i]) continue;

    board[i] = CPU;
    const score = minimax(board, 0, false);
    board[i] = '';

    if (score > bestScore) {
      bestScore = score;
      move = i;
    }
  }
  return move;
}

function minimax(b, depth, isMaximizing) {
  const result = checkResult(b);

  if (result) {
    if (result.draw) return 0;
    // Vitória mais rápida vale mais; derrota mais tardia dói menos
    return result.winner === CPU ? 10 - depth : depth - 10;
  }

  if (isMaximizing) {
    let best = -Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = CPU;
      best = Math.max(best, minimax(b, depth + 1, false));
      b[i] = '';
    }
    return best;
  } else {
    let best = Infinity;
    for (let i = 0; i < 9; i++) {
      if (b[i]) continue;
      b[i] = HUMANO;
      best = Math.min(best, minimax(b, depth + 1, true));
      b[i] = '';
    }
    return best;
  }
}

/* =========================================================
   INTERFACE
   ========================================================= */
function updateStatus() {
  if (!running) return;
  statusEl.className = 'status';

  if (vsComputer) {
    statusEl.textContent = current === HUMANO ? 'Sua vez' : 'CPU pensando…';
  } else {
    statusEl.textContent = `Vez do ${current}`;
  }
  statusEl.classList.add(current === HUMANO ? 'turn-x' : 'turn-o');
}

function updateScores() {
  scoreXEl.textContent = scores.X;
  scoreOEl.textContent = scores.O;
  scoreDEl.textContent = scores.D;
}

function updateLabels() {
  labelXEl.textContent = vsComputer ? 'Você (X)' : 'Jogador X';
  labelOEl.textContent = vsComputer ? 'CPU (O)' : 'Jogador O';
}

/* =========================================================
   EVENTOS
   ========================================================= */
resetBtn.addEventListener('click', newGame);

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.mode-btn')
      .forEach(b => b.classList.toggle('active', b === btn));

    vsComputer = btn.dataset.mode === 'cpu';
    scores = { X: 0, O: 0, D: 0 };

    updateScores();
    updateLabels();
    newGame();
  });
});

/* =========================================================
   INICIALIZAÇÃO
   ========================================================= */
buildBoard();
updateLabels();
updateScores();
newGame();
</script>
</body>
</html>
