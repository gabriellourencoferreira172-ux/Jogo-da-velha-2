<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: Arial, Helvetica, sans-serif;
    background: #1a1a2e; color: #eee;
    min-height: 100vh; display: flex;
    align-items: center; justify-content: center;
    padding: 20px;
  }
  .app {
    background: #16213e; border-radius: 14px;
    padding: 24px; width: 380px; max-width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  }
  h1 { text-align: center; font-size: 1.4rem; margin-bottom: 4px; }
  .sub { text-align: center; font-size: 0.8rem; color: #888; margin-bottom: 18px; }

  .screen { display: none; }
  .screen.active { display: block; }

  .btn {
    width: 100%; padding: 12px; border: 0; border-radius: 10px;
    font-size: 15px; font-weight: bold; cursor: pointer;
    margin-bottom: 8px;
  }
  .btn-primary { background: #e94560; color: #fff; }
  .btn-primary:hover { background: #ff5470; }
  .btn-secondary { background: #0f3460; color: #4cc9f0; }
  .btn-secondary:hover { background: #16376b; }
  .btn-easy    { background: #16a34a; color: #fff; }
  .btn-medium  { background: #eab308; color: #1a1a2e; }
  .btn-hard    { background: #dc2626; color: #fff; }
  .btn-easy:hover   { background: #22c55e; }
  .btn-medium:hover { background: #facc15; }
  .btn-hard:hover   { background: #ef4444; }
  .btn-back {
    background: transparent; color: #888; font-size: 13px;
    padding: 8px; margin-top: 4px;
  }
  .btn-back:hover { color: #fff; }

  .status {
    text-align: center; padding: 10px; background: #0f3460;
    border-radius: 8px; margin-bottom: 12px; font-weight: bold;
    min-height: 40px; display: flex; align-items: center; justify-content: center;
    font-size: 14px;
  }

  /* Placar */
  .scores { display: flex; gap: 6px; margin-bottom: 12px; }
  .score {
    flex: 1; background: #0f3460; border-radius: 8px;
    padding: 6px; text-align: center;
  }
  .score-label { font-size: 10px; color: #999; text-transform: uppercase; }
  .score-value { font-size: 18px; font-weight: bold; margin-top: 2px; }
  .score.x .score-value { color: #4cc9f0; }
  .score.o .score-value { color: #f72585; }

  .board {
    display: grid;
    grid-template-columns: repeat(3, 80px);
    grid-template-rows: repeat(3, 80px);
    gap: 6px; justify-content: center; margin-bottom: 14px;
  }
  .cell {
    width: 80px; height: 80px; border: 0; border-radius: 8px;
    background: #0f3460; color: #fff; font-size: 38px;
    font-weight: bold; font-family: inherit; cursor: pointer;
    line-height: 1; padding: 0;
  }
  .cell:hover:not(:disabled) { background: #16376b; }
  .cell.x { color: #4cc9f0; }
  .cell.o { color: #f72585; }
  .cell.win { background: #f9c74f; color: #1a1a2e; }
  .cell:disabled { cursor: default; }

  .players { font-size: 11px; color: #999; text-align: center; margin-bottom: 8px; }

  .diff-tag {
    display: inline-block; padding: 2px 8px; border-radius: 6px;
    font-size: 11px; font-weight: bold; margin-left: 6px;
  }
  .diff-tag.easy   { background: #16a34a; color: #fff; }
  .diff-tag.medium { background: #eab308; color: #1a1a2e; }
  .diff-tag.hard   { background: #dc2626; color: #fff; }
</style>
</head>
<body>

<div class="app">
  <h1>Jogo da Velha</h1>
  <p class="sub">Escolha um modo</p>

  <!-- MENU -->
  <div id="screenMenu" class="screen active">
    <button class="btn btn-primary" id="btnGoCpu">🎮 Jogar vs CPU</button>
    <button class="btn btn-secondary" id="btnGoPvp">👥 2 Jogadores</button>
  </div>

  <!-- DIFICULDADE -->
  <div id="screenDiff" class="screen">
    <p style="text-align:center; font-size:13px; color:#999; margin-bottom:12px;">
      Escolha a dificuldade
    </p>
    <button class="btn btn-easy"   data-diff="easy">😊 Fácil</button>
    <button class="btn btn-medium" data-diff="medium">😐 Médio</button>
    <button class="btn btn-hard"   data-diff="hard">😈 Difícil</button>
    <button class="btn btn-back" id="btnBackMenu1">← Voltar</button>
  </div>

  <!-- JOGO VS CPU -->
  <div id="screenCpu" class="screen">
    <div class="players" id="cpuInfo"></div>
    <div class="status" id="cpuStatus">Sua vez</div>
    <div class="board" id="cpuBoard"></div>
    <button class="btn btn-primary" id="btnCpuRestart">Nova Partida</button>
    <button class="btn btn-back" id="btnBackMenu2">← Voltar ao menu</button>
  </div>

  <!-- JOGO 2 JOGADORES -->
  <div id="screenPvp" class="screen">
    <div class="scores">
      <div class="score x">
        <div class="score-label">Jogador X</div>
        <div class="score-value" id="pvpScoreX">0</div>
      </div>
      <div class="score">
        <div class="score-label">Empates</div>
        <div class="score-value" id="pvpScoreD">0</div>
      </div>
      <div class="score o">
        <div class="score-label">Jogador O</div>
        <div class="score-value" id="pvpScoreO">0</div>
      </div>
    </div>
    <div class="status" id="pvpStatus">Vez do X</div>
    <div class="board" id="pvpBoard"></div>
    <button class="btn btn-primary" id="btnPvpRestart">Nova Partida</button>
    <button class="btn btn-back" id="btnBackMenu3">← Voltar ao menu</button>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =====================================================
     UTILITÁRIOS COMUNS
     ===================================================== */
  var COMBOS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  var HUMAN = "X";
  var CPU   = "O";

  function showScreen(id) {
    var all = document.querySelectorAll(".screen");
    for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
    document.getElementById(id).classList.add("active");
  }

  function checkWinner(b) {
    for (var i = 0; i < COMBOS.length; i++) {
      var c = COMBOS[i];
      if (b[c[0]] && b[c[0]] === b[c[1]] && b[c[0]] === b[c[2]]) {
        return { winner: b[c[0]], line: c };
      }
    }
    for (var j = 0; j < 9; j++) if (b[j] === "") return null;
    return { draw: true };
  }

  function emptyCells(b) {
    var arr = [];
    for (var i = 0; i < 9; i++) if (b[i] === "") arr.push(i);
    return arr;
  }

  function randomMove(b) {
    var e = emptyCells(b);
    if (!e.length) return -1;
    return e[Math.floor(Math.random() * e.length)];
  }

  function findWinningMove(b, player) {
    for (var i = 0; i < COMBOS.length; i++) {
      var c = COMBOS[i];
      var vals = [b[c[0]], b[c[1]], b[c[2]]];
      var countP = 0, countE = 0;
      for (var k = 0; k < 3; k++) {
        if (vals[k] === player) countP++;
        else if (vals[k] === "") countE++;
      }
      if (countP === 2 && countE === 1) {
        if (b[c[0]] === "") return c[0];
        if (b[c[1]] === "") return c[1];
        return c[2];
      }
    }
    return -1;
  }

  function minimax(b, depth, isMax) {
    var r = checkWinner(b);
    if (r) {
      if (r.draw) return 0;
      return (r.winner === CPU) ? (10 - depth) : (depth - 10);
    }
    var best, i;
    if (isMax) {
      best = -Infinity;
      for (i = 0; i < 9; i++) {
        if (b[i] !== "") continue;
        b[i] = CPU;
        var s = minimax(b, depth + 1, false);
        if (s > best) best = s;
        b[i] = "";
      }
    } else {
      best = Infinity;
      for (i = 0; i < 9; i++) {
        if (b[i] !== "") continue;
        b[i] = HUMAN;
        var s2 = minimax(b, depth + 1, true);
        if (s2 < best) best = s2;
        b[i] = "";
      }
    }
    return best;
  }

  function bestMoveMinimax(b) {
    var best = -Infinity, move = -1;
    for (var i = 0; i < 9; i++) {
      if (b[i] !== "") continue;
      b[i] = CPU;
      var s = minimax(b, 0, false);
      b[i] = "";
      if (s > best) { best = s; move = i; }
    }
    return move;
  }

  /* =====================================================
     NAVEGAÇÃO
     ===================================================== */
  document.getElementById("btnGoCpu").addEventListener("click", function () {
    showScreen("screenDiff");
  });
  document.getElementById("btnGoPvp").addEventListener("click", function () {
    showScreen("screenPvp");
    startPvpGame();
  });
  document.getElementById("btnBackMenu1").addEventListener("click", function () {
    showScreen("screenMenu");
  });
  document.getElementById("btnBackMenu2").addEventListener("click", function () {
    clearTimeout(cpuTimer);
    cpuActive = false;
    showScreen("screenMenu");
  });
  document.getElementById("btnBackMenu3").addEventListener("click", function () {
    showScreen("screenMenu");
  });

  /* =====================================================
     ==============  MODO CPU (3 DIFICULDADES) ===========
     ===================================================== */
  var cpuBoard = ["","","","","","","","",""];
  var cpuTurn = HUMAN;
  var cpuActive = false;
  var cpuDiff = "medium";
  var cpuTimer = null;
  var cpuCells = [];

  document.querySelectorAll("[data-diff]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      cpuDiff = btn.dataset.diff;
      showScreen("screenCpu");
      startCpuGame();
    });
  });

  function buildCpuBoard() {
    var el = document.getElementById("cpuBoard");
    el.innerHTML = "";
    cpuCells = [];
    for (var i = 0; i < 9; i++) {
      (function (idx) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "cell";
        b.addEventListener("click", function () { onCpuCellClick(idx); });
        el.appendChild(b);
        cpuCells.push(b);
      })(i);
    }
  }

  function startCpuGame() {
    clearTimeout(cpuTimer);
    cpuBoard = ["","","","","","","","",""];
    cpuTurn = HUMAN;
    cpuActive = true;

    if (!cpuCells.length) buildCpuBoard();
    for (var i = 0; i < 9; i++) {
      cpuCells[i].textContent = "";
      cpuCells[i].className = "cell";
      cpuCells[i].disabled = false;
    }

    var labels = { easy: "Fácil", medium: "Médio", hard: "Difícil" };
    document.getElementById("cpuInfo").innerHTML =
      'Você é X <span class="diff-tag ' + cpuDiff + '">' + labels[cpuDiff] + '</span>';

    updateCpuStatus();
  }

  function updateCpuStatus() {
    document.getElementById("cpuStatus").textContent =
      cpuTurn === HUMAN ? "Sua vez" : "CPU pensando...";
  }

  function onCpuCellClick(i) {
    if (!cpuActive) return;
    if (cpuTurn !== HUMAN) return;
    if (cpuBoard[i] !== "") return;
    playCpuMove(i, HUMAN);
  }

  function playCpuMove(i, player) {
    cpuBoard[i] = player;
    cpuCells[i].textContent = player;
    cpuCells[i].className = "cell " + player.toLowerCase();

    var result = checkWinner(cpuBoard);
    if (result) { endCpuGame(result); return; }

    cpuTurn = (player === HUMAN) ? CPU : HUMAN;
    updateCpuStatus();

    if (cpuTurn === CPU) {
      cpuTimer = setTimeout(cpuPlay, 400);
    }
  }

  function cpuPlay() {
    if (!cpuActive || cpuTurn !== CPU) return;
    var move = chooseCpuMove();
    if (move >= 0) playCpuMove(move, CPU);
  }

  function endCpuGame(result) {
    cpuActive = false;
    var el = document.getElementById("cpuStatus");

    if (result.draw) {
      el.textContent = "Empate! 🤝";
    } else {
      for (var i = 0; i < result.line.length; i++) {
        cpuCells[result.line[i]].classList.add("win");
      }
      el.textContent = (result.winner === HUMAN)
        ? "Você venceu! 🎉"
        : "CPU venceu! 🤖";
    }
    for (var j = 0; j < 9; j++) cpuCells[j].disabled = true;
  }

  function chooseCpuMove() {
    var b = cpuBoard;

    if (cpuDiff === "easy") {
      // 75% aleatório, 25% esperto
      if (Math.random() < 0.75) return randomMove(b);
      var win = findWinningMove(b, CPU);
      if (win >= 0) return win;
      var block = findWinningMove(b, HUMAN);
      if (block >= 0) return block;
      return randomMove(b);
    }

    if (cpuDiff === "medium") {
      var win2 = findWinningMove(b, CPU);
      if (win2 >= 0) return win2;

      var block2 = findWinningMove(b, HUMAN);
      if (block2 >= 0) return block2;

      if (b[4] === "") return 4;

      return randomMove(b);
    }

    // hard
    return bestMoveMinimax(b);
  }

  document.getElementById("btnCpuRestart").addEventListener("click", startCpuGame);

  /* =====================================================
     ===================  2 JOGADORES  ===================
     ===================================================== */
  var pvpBoard = ["","","","","","","","",""];
  var pvpTurn = "X";
  var pvpActive = false;
  var pvpCells = [];
  var pvpScores = { X: 0, O: 0, D: 0 };

  function buildPvpBoard() {
    var el = document.getElementById("pvpBoard");
    el.innerHTML = "";
    pvpCells = [];
    for (var i = 0; i < 9; i++) {
      (function (idx) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "cell";
        b.addEventListener("click", function () { onPvpCellClick(idx); });
        el.appendChild(b);
        pvpCells.push(b);
      })(i);
    }
  }

  function startPvpGame() {
    pvpBoard = ["","","","","","","","",""];
    pvpTurn = "X";
    pvpActive = true;

    if (!pvpCells.length) buildPvpBoard();
    for (var i = 0; i < 9; i++) {
      pvpCells[i].textContent = "";
      pvpCells[i].className = "cell";
      pvpCells[i].disabled = false;
    }
    updatePvpStatus();
  }

  function updatePvpStatus() {
    document.getElementById("pvpStatus").textContent = "Vez do " + pvpTurn;
  }

  function updatePvpScores() {
    document.getElementById("pvpScoreX").textContent = pvpScores.X;
    document.getElementById("pvpScoreO").textContent = pvpScores.O;
    document.getElementById("pvpScoreD").textContent = pvpScores.D;
  }

  function onPvpCellClick(i) {
    if (!pvpActive) return;
    if (pvpBoard[i] !== "") return;

    pvpBoard[i] = pvpTurn;
    pvpCells[i].textContent = pvpTurn;
    pvpCells[i].className = "cell " + pvpTurn.toLowerCase();

    var result = checkWinner(pvpBoard);
    if (result) { endPvpGame(result); return; }

    pvpTurn = (pvpTurn === "X") ? "O" : "X";
    updatePvpStatus();
  }

  function endPvpGame(result) {
    pvpActive = false;
    var el = document.getElementById("pvpStatus");

    if (result.draw) {
      pvpScores.D++;
      el.textContent = "Empate! 🤝";
    } else {
      pvpScores[result.winner]++;
      for (var i = 0; i < result.line.length; i++) {
        pvpCells[result.line[i]].classList.add("win");
      }
      el.textContent = "Jogador " + result.winner + " venceu! 🎉";
    }
    for (var j = 0; j < 9; j++) pvpCells[j].disabled = true;
    updatePvpScores();
  }

  document.getElementById("btnPvpRestart").addEventListener("click", startPvpGame);

  /* =====================================================
     INICIALIZAÇÃO
     ===================================================== */
  buildCpuBoard();
  buildPvpBoard();
  updatePvpScores();
})();
</script>
</body>
</html>
