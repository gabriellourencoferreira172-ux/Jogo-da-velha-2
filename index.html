<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo da Velha</title>
<style>
  :root {
    --text: #e2e8f0;
    --muted: #94a3b8;
    --x: #38bdf8;
    --o: #fb7185;
    --win: #facc15;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    display: grid;
    place-items: center;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(1000px 600px at 50% -10%, #1e3a5f 0%, transparent 60%),
      radial-gradient(800px 500px at 100% 100%, #2b1e3f 0%, transparent 60%),
      radial-gradient(700px 500px at 0% 80%, #3f1e2e 0%, transparent 55%),
      #0b1120;
  }

  .app {
    width: min(100%, 430px);
    padding: 28px 24px 24px;
    border-radius: 28px;
    background: rgba(30, 41, 59, 0.55);
    border: 1px solid rgba(148, 163, 184, 0.15);
    box-shadow:
      0 30px 60px -20px rgba(0, 0, 0, .8),
      inset 0 1px 0 rgba(255, 255, 255, .05);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    animation: fadeIn .5s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  h1 {
    font-size: 1.6rem;
    text-align: center;
    letter-spacing: -.02em;
    background: linear-gradient(135deg, #7dd3fc, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .subtitle {
    text-align: center;
    color: var(--muted);
    font-size: .85rem;
    margin-top: 4px;
    margin-bottom: 20px;
  }

  /* Telas */
  .screen { display: none; }
  .screen.active { display: block; animation: fadeIn .35s ease; }

  /* Botões */
  .btn {
    width: 100%;
    padding: 14px;
    border: 0;
    border-radius: 16px;
    font: inherit;
    font-size: .95rem;
    font-weight: 700;
    cursor: pointer;
    margin-bottom: 10px;
    transition: transform .12s, filter .2s, box-shadow .25s;
  }
  .btn:active { transform: scale(.98); }

  .btn-primary {
    color: #0b1120;
    background: linear-gradient(135deg, #7dd3fc, #38bdf8);
    box-shadow: 0 10px 25px -10px rgba(56, 189, 248, .8);
  }
  .btn-primary:hover { filter: brightness(1.08); }

  .btn-secondary {
    color: #7dd3fc;
    background: rgba(56, 189, 248, .12);
    box-shadow: inset 0 0 0 1px rgba(56, 189, 248, .3);
  }
  .btn-secondary:hover { background: rgba(56, 189, 248, .2); }

  .btn-easy {
    color: #052e16;
    background: linear-gradient(135deg, #86efac, #22c55e);
    box-shadow: 0 10px 25px -12px rgba(34, 197, 94, .7);
  }
  .btn-easy:hover { filter: brightness(1.08); }

  .btn-medium {
    color: #422006;
    background: linear-gradient(135deg, #fde68a, #eab308);
    box-shadow: 0 10px 25px -12px rgba(234, 179, 8, .7);
  }
  .btn-medium:hover { filter: brightness(1.08); }

  .btn-hard {
    color: #fff;
    background: linear-gradient(135deg, #fca5a5, #dc2626);
    box-shadow: 0 10px 25px -12px rgba(220, 38, 38, .8);
  }
  .btn-hard:hover { filter: brightness(1.08); }

  .btn-back {
    background: transparent;
    color: var(--muted);
    font-size: .85rem;
    padding: 8px;
    margin-top: 6px;
    font-weight: 600;
  }
  .btn-back:hover { color: var(--text); }

  /* Status */
  .status {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 44px;
    margin-bottom: 16px;
    border-radius: 12px;
    background: rgba(15, 23, 42, .5);
    font-size: .95rem;
    font-weight: 600;
    text-align: center;
    transition: color .25s;
  }
  .status.turn-x { color: #7dd3fc; }
  .status.turn-o { color: #fda4af; }
  .status.turn-draw { color: var(--win); }

  /* Placar */
  .scores {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .score {
    padding: 10px 6px;
    text-align: center;
    border-radius: 14px;
    background: rgba(15, 23, 42, .6);
    border: 1px solid rgba(148, 163, 184, .1);
  }
  .score-label {
    display: block;
    font-size: .65rem;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--muted);
  }
  .score-value {
    display: block;
    font-size: 1.3rem;
    font-weight: 700;
    margin-top: 2px;
  }
  .score.x .score-value { color: var(--x); }
  .score.o .score-value { color: var(--o); }
  .score.d .score-value { color: var(--win); }

  /* Tabuleiro */
  .board {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 10px;
    aspect-ratio: 1 / 1;
    margin-bottom: 18px;
  }

  .cell {
    display: grid;
    place-items: center;
    font-family: inherit;
    font-size: clamp(2.2rem, 11vw, 3rem);
    font-weight: 700;
    line-height: 1;
    background: rgba(15, 23, 42, .75);
    border: 1px solid rgba(148, 163, 184, .12);
    border-radius: 18px;
    cursor: pointer;
    color: var(--text);
    transition: background .2s, border-color .2s, transform .1s, box-shadow .25s;
    -webkit-tap-highlight-color: transparent;
  }
  .cell:hover:not(.x):not(.o):not(:disabled) {
    background: rgba(56, 189, 248, .08);
    border-color: rgba(56, 189, 248, .25);
  }
  .cell:active:not(.x):not(.o):not(:disabled) { transform: scale(.97); }
  .cell:disabled { cursor: default; }

  .cell.x { color: var(--x); text-shadow: 0 0 24px rgba(56, 189, 248, .5); }
  .cell.o { color: var(--o); text-shadow: 0 0 24px rgba(251, 113, 133, .5); }

  /* Animação de marcação */
  .cell.pop { animation: pop .28s cubic-bezier(.2, 1.4, .5, 1); }
  @keyframes pop {
    from { transform: scale(.4); opacity: .2; }
    to   { transform: scale(1);  opacity: 1; }
  }

  /* Linha vencedora */
  .cell.win {
    background: rgba(250, 204, 21, .12);
    border-color: rgba(250, 204, 21, .5);
    animation: winPulse .8s ease-in-out infinite alternate;
  }
  @keyframes winPulse {
    to {
      box-shadow:
        0 0 0 1px rgba(250, 204, 21, .5),
        0 0 34px rgba(250, 204, 21, .35);
    }
  }

  /* Cabeçalho do jogo */
  .players {
    font-size: .8rem;
    color: var(--muted);
    text-align: center;
    margin-bottom: 12px;
    min-height: 20px;
  }

  .diff-tag {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 8px;
    font-size: .7rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .05em;
    margin-left: 6px;
  }
  .diff-tag.easy   { background: rgba(34, 197, 94, .2); color: #86efac; }
  .diff-tag.medium { background: rgba(234, 179, 8, .2); color: #fde68a; }
  .diff-tag.hard   { background: rgba(220, 38, 38, .2); color: #fca5a5; }

  /* Rodapé de botões do jogo */
  .game-actions {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }
</style>
</head>
<body>

<div class="app">
  <h1>Jogo da Velha</h1>
  <p class="subtitle">Três em linha para vencer</p>

  <!-- MENU -->
  <div id="screenMenu" class="screen active">
    <button class="btn btn-primary" id="btnGoCpu">🎮 Jogar vs CPU</button>
    <button class="btn btn-secondary" id="btnGoPvp">👥 2 Jogadores</button>
  </div>

  <!-- DIFICULDADE -->
  <div id="screenDiff" class="screen">
    <p style="text-align:center; font-size:.85rem; color:var(--muted); margin-bottom:16px;">
      Escolha a dificuldade
    </p>
    <button class="btn btn-easy"   data-diff="easy">😊 Fácil</button>
    <button class="btn btn-medium" data-diff="medium">😐 Médio</button>
    <button class="btn btn-hard"   data-diff="hard">😈 Difícil</button>
    <button class="btn btn-back" id="btnBackMenu1">← Voltar</button>
  </div>

  <!-- JOGO VS CPU -->
  <div id="screenCpu" class="screen">
    <div class="players" id="cpuInfo"></div>
    <div class="status turn-x" id="cpuStatus">Sua vez</div>
    <div class="board" id="cpuBoard"></div>
    <div class="game-actions">
      <button class="btn btn-primary" id="btnCpuRestart">Nova Partida</button>
      <button class="btn btn-back" id="btnBackMenu2">← Voltar ao menu</button>
    </div>
  </div>

  <!-- JOGO 2 JOGADORES -->
  <div id="screenPvp" class="screen">
    <div class="scores">
      <div class="score x">
        <div class="score-label">Jogador X</div>
        <div class="score-value" id="pvpScoreX">0</div>
      </div>
      <div class="score d">
        <div class="score-label">Empates</div>
        <div class="score-value" id="pvpScoreD">0</div>
      </div>
      <div class="score o">
        <div class="score-label">Jogador O</div>
        <div class="score-value" id="pvpScoreO">0</div>
      </div>
    </div>
    <div class="status turn-x" id="pvpStatus">Vez do X</div>
    <div class="board" id="pvpBoard"></div>
    <div class="game-actions">
      <button class="btn btn-primary" id="btnPvpRestart">Nova Partida</button>
      <button class="btn btn-back" id="btnBackMenu3">← Voltar ao menu</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  /* =====================================================
     UTILITÁRIOS COMUNS
     ===================================================== */
  var COMBOS = [
    [0,1,2],[3,4,5],[6,7,8],
    [0,3,6],[1,4,7],[2,5,8],
    [0,4,8],[2,4,6]
  ];

  var HUMAN = "X";
  var CPU   = "O";

  function showScreen(id) {
    var all = document.querySelectorAll(".screen");
    for (var i = 0; i < all.length; i++) all[i].classList.remove("active");
    document.getElementById(id).classList.add("active");
  }

  function checkWinner(b) {
    for (var i = 0; i < COMBOS.length; i++) {
      var c = COMBOS[i];
      if (b[c[0]] && b[c[0]] === b[c[1]] && b[c[0]] === b[c[2]]) {
        return { winner: b[c[0]], line: c };
      }
    }
    for (var j = 0; j < 9; j++) if (b[j] === "") return null;
    return { draw: true };
  }

  function emptyCells(b) {
    var arr = [];
    for (var i = 0; i < 9; i++) if (b[i] === "") arr.push(i);
    return arr;
  }

  function randomMove(b) {
    var e = emptyCells(b);
    if (!e.length) return -1;
    return e[Math.floor(Math.random() * e.length)];
  }

  function findWinningMove(b, player) {
    for (var i = 0; i < COMBOS.length; i++) {
      var c = COMBOS[i];
      var vals = [b[c[0]], b[c[1]], b[c[2]]];
      var countP = 0, countE = 0;
      for (var k = 0; k < 3; k++) {
        if (vals[k] === player) countP++;
        else if (vals[k] === "") countE++;
      }
      if (countP === 2 && countE === 1) {
        if (b[c[0]] === "") return c[0];
        if (b[c[1]] === "") return c[1];
        return c[2];
      }
    }
    return -1;
  }

  function minimax(b, depth, isMax) {
    var r = checkWinner(b);
    if (r) {
      if (r.draw) return 0;
      return (r.winner === CPU) ? (10 - depth) : (depth - 10);
    }
    var best, i;
    if (isMax) {
      best = -Infinity;
      for (i = 0; i < 9; i++) {
        if (b[i] !== "") continue;
        b[i] = CPU;
        var s = minimax(b, depth + 1, false);
        if (s > best) best = s;
        b[i] = "";
      }
    } else {
      best = Infinity;
      for (i = 0; i < 9; i++) {
        if (b[i] !== "") continue;
        b[i] = HUMAN;
        var s2 = minimax(b, depth + 1, true);
        if (s2 < best) best = s2;
        b[i] = "";
      }
    }
    return best;
  }

  function bestMoveMinimax(b) {
    var best = -Infinity, move = -1;
    for (var i = 0; i < 9; i++) {
      if (b[i] !== "") continue;
      b[i] = CPU;
      var s = minimax(b, 0, false);
      b[i] = "";
      if (s > best) { best = s; move = i; }
    }
    return move;
  }

  /* =====================================================
     NAVEGAÇÃO
     ===================================================== */
  document.getElementById("btnGoCpu").addEventListener("click", function () {
    showScreen("screenDiff");
  });
  document.getElementById("btnGoPvp").addEventListener("click", function () {
    showScreen("screenPvp");
    startPvpGame();
  });
  document.getElementById("btnBackMenu1").addEventListener("click", function () {
    showScreen("screenMenu");
  });
  document.getElementById("btnBackMenu2").addEventListener("click", function () {
    clearTimeout(cpuTimer);
    cpuActive = false;
    showScreen("screenMenu");
  });
  document.getElementById("btnBackMenu3").addEventListener("click", function () {
    showScreen("screenMenu");
  });

  /* =====================================================
     ==============  MODO CPU (3 DIFICULDADES) ===========
     ===================================================== */
  var cpuBoard = ["","","","","","","","",""];
  var cpuTurn = HUMAN;
  var cpuActive = false;
  var cpuDiff = "medium";
  var cpuTimer = null;
  var cpuCells = [];

  document.querySelectorAll("[data-diff]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      cpuDiff = btn.dataset.diff;
      showScreen("screenCpu");
      startCpuGame();
    });
  });

  function buildCpuBoard() {
    var el = document.getElementById("cpuBoard");
    el.innerHTML = "";
    cpuCells = [];
    for (var i = 0; i < 9; i++) {
      (function (idx) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "cell";
        b.addEventListener("click", function () { onCpuCellClick(idx); });
        el.appendChild(b);
        cpuCells.push(b);
      })(i);
    }
  }

  function startCpuGame() {
    clearTimeout(cpuTimer);
    cpuBoard = ["","","","","","","","",""];
    cpuTurn = HUMAN;
    cpuActive = true;

    if (!cpuCells.length) buildCpuBoard();
    for (var i = 0; i < 9; i++) {
      cpuCells[i].textContent = "";
      cpuCells[i].className = "cell";
      cpuCells[i].disabled = false;
    }

    var labels = { easy: "Fácil", medium: "Médio", hard: "Difícil" };
    document.getElementById("cpuInfo").innerHTML =
      'Você é X <span class="diff-tag ' + cpuDiff + '">' + labels[cpuDiff] + '</span>';

    updateCpuStatus();
  }

  function updateCpuStatus() {
    var el = document.getElementById("cpuStatus");
    if (cpuTurn === HUMAN) {
      el.textContent = "Sua vez";
      el.className = "status turn-x";
    } else {
      el.textContent = "CPU pensando...";
      el.className = "status turn-o";
    }
  }

  function onCpuCellClick(i) {
    if (!cpuActive) return;
    if (cpuTurn !== HUMAN) return;
    if (cpuBoard[i] !== "") return;
    playCpuMove(i, HUMAN);
  }

  function playCpuMove(i, player) {
    cpuBoard[i] = player;
    cpuCells[i].textContent = player;
    cpuCells[i].className = "cell " + player.toLowerCase() + " pop";

    var result = checkWinner(cpuBoard);
    if (result) { endCpuGame(result); return; }

    cpuTurn = (player === HUMAN) ? CPU : HUMAN;
    updateCpuStatus();

    if (cpuTurn === CPU) {
      cpuTimer = setTimeout(cpuPlay, 450);
    }
  }

  function cpuPlay() {
    if (!cpuActive || cpuTurn !== CPU) return;
    var move = chooseCpuMove();
    if (move >= 0) playCpuMove(move, CPU);
  }

  function endCpuGame(result) {
    cpuActive = false;
    var el = document.getElementById("cpuStatus");

    if (result.draw) {
      el.textContent = "Empate! 🤝";
      el.className = "status turn-draw";
    } else {
      for (var i = 0; i < result.line.length; i++) {
        cpuCells[result.line[i]].classList.add("win");
      }
      el.textContent = (result.winner === HUMAN)
        ? "Você venceu! 🎉"
        : "CPU venceu! 🤖";
      el.className = "status " + (result.winner === HUMAN ? "turn-x" : "turn-o");
    }
    for (var j = 0; j < 9; j++) cpuCells[j].disabled = true;
  }

  function chooseCpuMove() {
    var b = cpuBoard;

    if (cpuDiff === "easy") {
      if (Math.random() < 0.75) return randomMove(b);
      var win = findWinningMove(b, CPU);
      if (win >= 0) return win;
      var block = findWinningMove(b, HUMAN);
      if (block >= 0) return block;
      return randomMove(b);
    }

    if (cpuDiff === "medium") {
      var win2 = findWinningMove(b, CPU);
      if (win2 >= 0) return win2;
      var block2 = findWinningMove(b, HUMAN);
      if (block2 >= 0) return block2;
      if (b[4] === "") return 4;
      return randomMove(b);
    }

    return bestMoveMinimax(b);
  }

  document.getElementById("btnCpuRestart").addEventListener("click", startCpuGame);

  /* =====================================================
     ===================  2 JOGADORES  ===================
     ===================================================== */
  var pvpBoard = ["","","","","","","","",""];
  var pvpTurn = "X";
  var pvpActive = false;
  var pvpCells = [];
  var pvpScores = { X: 0, O: 0, D: 0 };

  function buildPvpBoard() {
    var el = document.getElementById("pvpBoard");
    el.innerHTML = "";
    pvpCells = [];
    for (var i = 0; i < 9; i++) {
      (function (idx) {
        var b = document.createElement("button");
        b.type = "button";
        b.className = "cell";
        b.addEventListener("click", function () { onPvpCellClick(idx); });
        el.appendChild(b);
        pvpCells.push(b);
      })(i);
    }
  }

  function startPvpGame() {
    pvpBoard = ["","","","","","","","",""];
    pvpTurn = "X";
    pvpActive = true;

    if (!pvpCells.length) buildPvpBoard();
    for (var i = 0; i < 9; i++) {
      pvpCells[i].textContent = "";
      pvpCells[i].className = "cell";
      pvpCells[i].disabled = false;
    }
    updatePvpStatus();
  }

  function updatePvpStatus() {
    var el = document.getElementById("pvpStatus");
    el.textContent = "Vez do " + pvpTurn;
    el.className = "status " + (pvpTurn === "X" ? "turn-x" : "turn-o");
  }

  function updatePvpScores() {
    document.getElementById("pvpScoreX").textContent = pvpScores.X;
    document.getElementById("pvpScoreO").textContent = pvpScores.O;
    document.getElementById("pvpScoreD").textContent = pvpScores.D;
  }

  function onPvpCellClick(i) {
    if (!pvpActive) return;
    if (pvpBoard[i] !== "") return;

    pvpBoard[i] = pvpTurn;
    pvpCells[i].textContent = pvpTurn;
    pvpCells[i].className = "cell " + pvpTurn.toLowerCase() + " pop";

    var result = checkWinner(pvpBoard);
    if (result) { endPvpGame(result); return; }

    pvpTurn = (pvpTurn === "X") ? "O" : "X";
    updatePvpStatus();
  }

  function endPvpGame(result) {
    pvpActive = false;
    var el = document.getElementById("pvpStatus");

    if (result.draw) {
      pvpScores.D++;
      el.textContent = "Empate! 🤝";
      el.className = "status turn-draw";
    } else {
      pvpScores[result.winner]++;
      for (var i = 0; i < result.line.length; i++) {
        pvpCells[result.line[i]].classList.add("win");
      }
      el.textContent = "Jogador " + result.winner + " venceu! 🎉";
      el.className = "status " + (result.winner === "X" ? "turn-x" : "turn-o");
    }
    for (var j = 0; j < 9; j++) pvpCells[j].disabled = true;
    updatePvpScores();
  }

  document.getElementById("btnPvpRestart").addEventListener("click", startPvpGame);

  /* =====================================================
     INICIALIZAÇÃO
     ===================================================== */
  buildCpuBoard();
  buildPvpBoard();
  updatePvpScores();
})();
</script>
</body>
</html>
